name: Build TeleFocus

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          set -euo pipefail
          brew install make ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Theos + SDKs
        run: |
          set -euo pipefail
          export THEOS="${GITHUB_WORKSPACE}/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          rm -rf "$THEOS"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$THEOS"

          # Submodule placeholder is NOT a real directory — wipe and recreate
          rm -rf "$THEOS/sdks"
          mkdir -p "$THEOS/sdks"

          TMP=$(mktemp -d)
          curl -L --retry 3 -o "$TMP/sdks.zip" \
            "https://github.com/theos/sdks/archive/refs/heads/master.zip"
          unzip -q "$TMP/sdks.zip" -d "$TMP"

          if ls "$TMP"/sdks-master/*.sdk >/dev/null 2>&1; then
            cp -R "$TMP"/sdks-master/*.sdk "$THEOS/sdks/"
          else
            find "$TMP" -type d -name "*.sdk" -maxdepth 4 -exec cp -R {} "$THEOS/sdks/" \;
          fi

          if ! ls "$THEOS/sdks"/*.sdk >/dev/null 2>&1; then
            echo "Trying install-sdk latest…"
            "$THEOS/bin/install-sdk" latest || true
          fi

          echo "=== SDKs ==="
          ls -la "$THEOS/sdks"
          test -n "$(ls -A "$THEOS/sdks"/*.sdk 2>/dev/null || true)" \
            || { echo "::error::No iPhoneOS SDK installed"; exit 1; }

          # Pick highest iPhoneOS SDK version number for TARGET
          SDK_VER=$(ls -1 "$THEOS/sdks" | grep -E '^iPhoneOS[0-9]' | sed 's/iPhoneOS//;s/\.sdk//' | sort -V | tail -1)
          echo "Detected SDK version: $SDK_VER"
          echo "SDK_VER=$SDK_VER" >> "$GITHUB_ENV"
          rm -rf "$TMP"

      - name: Build package
        run: |
          set -euo pipefail
          export THEOS="${GITHUB_WORKSPACE}/theos"
          # Pin TARGET to a real SDK that exists on the runner
          export TARGET="iphone:clang:${SDK_VER}:12.0"
          echo "Building with TARGET=$TARGET"
          make clean
          make package FINALPACKAGE=1 2>&1

      - name: Show dylib inside deb
        if: success()
        run: |
          set -euo pipefail
          ls -la packages/
          deb=$(ls packages/*.deb | head -1)
          mkdir -p /tmp/tfout
          cd /tmp/tfout
          ar x "$GITHUB_WORKSPACE/$deb" || true
          tar xf data.tar.* 2>/dev/null || tar xf data.tar 2>/dev/null || true
          find /tmp/tfout -type f | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: TeleFocus-deb
          path: packages/*.deb
          if-no-files-found: error
