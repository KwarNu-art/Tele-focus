name: Build TeleFocus

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          set -euo pipefail
          brew install make ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Theos + SDKs
        run: |
          set -euo pipefail
          export THEOS="${GITHUB_WORKSPACE}/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          rm -rf "$THEOS"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          mkdir -p "$THEOS/sdks"

          TMP=$(mktemp -d)
          curl -L --retry 3 -o "$TMP/sdks.zip" \
            "https://github.com/theos/sdks/archive/refs/heads/master.zip"
          unzip -q "$TMP/sdks.zip" -d "$TMP"

          if ls "$TMP"/sdks-master/*.sdk >/dev/null 2>&1; then
            cp -R "$TMP"/sdks-master/*.sdk "$THEOS/sdks/"
          else
            find "$TMP" -type d -name "*.sdk" -maxdepth 4 -exec cp -R {} "$THEOS/sdks/" \;
          fi

          if ! ls "$THEOS/sdks"/*.sdk >/dev/null 2>&1; then
            "$THEOS/bin/install-sdk" latest || true
          fi

          ls -la "$THEOS/sdks"
          test -n "$(ls -A "$THEOS/sdks"/*.sdk 2>/dev/null || true)" \
            || { echo "::error::No iPhoneOS SDK"; exit 1; }

          SDK_VER=$(ls -1 "$THEOS/sdks" | grep -E '^iPhoneOS[0-9]' | sed 's/iPhoneOS//;s/\.sdk//' | sort -V | tail -1)
          echo "SDK_VER=$SDK_VER" >> "$GITHUB_ENV"
          rm -rf "$TMP"

      - name: Build arm64 package
        run: |
          set -euo pipefail
          export THEOS="${GITHUB_WORKSPACE}/theos"
          export TARGET="iphone:clang:${SDK_VER}:12.0"
          export ARCHS=arm64
          echo "TARGET=$TARGET ARCHS=$ARCHS"
          # control Architecture: iphoneos-arm64 → output *iphoneos-arm64.deb
          make clean package FINALPACKAGE=1 2>&1
          echo "=== packages ==="
          ls -la packages/
          ls packages/*arm64*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: TeleFocus-iphoneos-arm64-deb
          path: packages/*arm64*.deb
          if-no-files-found: error
